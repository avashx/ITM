<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Service Status · IT Monitor</title>
  <script>(function(){try{var t=localStorage.getItem('itm-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');var q=new URLSearchParams(location.search).get('theme');if(q==='light'||q==='dark')t=q;document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128994;</text></svg>" />
</head>
<body>
<header class="topnav">
    <div class="tn-brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </span>
      IT Monitor
    </div>
    <nav class="tn-links">
      <a href="/">Service Status</a>
      <a href="/dashboard.html">Ops Dashboard</a>
      <a href="/grievances.html">Grievances</a>
      <a href="/correlation.html">Correlation</a>
    </nav>
    <div class="tn-right">
      <a class="icon-btn" href="https://github.com/avashx/ITM#readme" target="_blank" rel="noopener" title="Documentation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </a>
      <a class="icon-btn" href="/api/health" target="_blank" rel="noopener" title="API health">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg>
      </a>
      <div class="chip off" id="live-chip"><span class="dot"></span><span class="txt">OFFLINE</span></div>
      <div class="chip clock"><span id="ist-clock">--:--:--</span></div>
      <button class="icon-btn" id="theme-btn" title="Toggle theme">
        <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <div class="who"><div class="av">IT</div><div class="wt">IT Department<small>GNCTD · Delhi</small></div></div>
    </div>
  </header>

  <main class="main">
    <header class="page-head">
      <div>
        <h1>Service Status</h1>
      </div>
      <div class="head-actions">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="svc-search" placeholder="Search services or departments…" />
        </div>
      </div>
    </header>

    <div id="demo-banner" class="demo-banner"></div>

    <div id="overall" class="overall operational">
      <span class="dot"></span>
      <span id="overall-text">Loading service status&hellip;</span>
      <small id="overall-time"></small>
    </div>

    <div class="tiles" id="tiles"></div>

    <section id="incidents-card" class="card" style="display:none">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Active incidents
      </h2>
      <div id="incidents" class="feed"></div>
    </section>

    <div id="categories"></div>

    <footer class="foot">
      Government of NCT of Delhi &middot; e-Services Health Monitor &middot;
      checks run every 5 minutes &middot; <span id="svc-count" class="mono"></span>
    </footer>
  </main>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/common.js"></script>
<script src="/js/status.js"></script>
</body>
</html>
